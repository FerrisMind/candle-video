[package]
name = "candle-video"
version = "0.1.0"
edition = "2024"
authors = ["FerrisMind"]
description = "LTX-Video integration for Candle framework"
license = "Apache-2.0"
repository = "https://github.com/FerrisMind/candle-video"

[lib]
name = "candle_video"
path = "src/lib.rs"

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
candle-flash-attn = { version = "0.10.2", optional = true }
safetensors = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
tokenizers = "0.23.1"
thiserror = "2.0.18"
hf-hub = "0.4.3"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.4.7"
image = "0.25.10"
indicatif = "0.18.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = { version = "0.11.4", optional = true }
glob = "0.3.3"
statrs = "0.18.0"
gif = "0.14.2"
openh264 = "0.9.7"
muxide = "0.2.5"
rayon = "1.12.0"
rand = "0.10.1"
regex = "1.12.3"



[features]
default = []
legacy_tests = []
# Profiling instrumentation (tracing spans; no runtime cost when disabled)
profiling = ["tracing/max_level_trace"]
tracy = ["profiling", "dep:tracing-tracy"]
# GPU Acceleration
flash-attn = ["dep:candle-flash-attn"]
cuda = ["candle-core/cuda"]
# cuDNN for faster convolutions (requires CUDA)
cudnn = ["candle-core/cudnn"]
# Intel MKL for CPU acceleration (Linux/Windows x86_64)
mkl = ["candle-core/mkl"]
# Apple Accelerate for Metal acceleration (macOS)
accelerate = ["candle-core/accelerate"]
# NCCL for multi-GPU support
nccl = ["candle-core/nccl"]
# GPU optimizations (for maximum performance)
gpu = ["flash-attn", "cuda", "cudnn"]

[profile.release]
debug = "line-tables-only"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
bytemuck = "1.25.0"
proptest = "1.11.0"

# =============================================================================
# Benchmarks
# =============================================================================

[[bench]]
name = "ltx_video_benchmarks"
harness = false

[[bench]]
name = "wan_benchmarks"
harness = false

